[project]
name = "minilakehouse"
version = "0.1.0"
description = "A small medallion-style data platform on DuckDB: bronze, silver, gold, a dbt-like runner, quality gates, incremental loads, and lineage."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1"]

[project.scripts]
minilakehouse = "minilakehouse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minilakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
